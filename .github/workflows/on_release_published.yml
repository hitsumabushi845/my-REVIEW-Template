name: Build Re:VIEW to make distribution file
# The workflow is triggered on pushes to the repository.
on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to upload assets to the release
    steps:
      # uses v3 Stable version
      # https://github.com/actions/checkout
      - name: checkout source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # Build Artifacts
      - name: Build Book file
        uses: hitsumabushi845/ReVIEW-build-artifact-action@a076ebb331d828a3904f887933a52fcd2a27f39c # v1.1.0
      # Fetch Book title
      - name: Fetch book title
        id: bookTitle
        uses: mikefarah/yq@1b9b4ac5187171d2e5e3129be0cfa827c7f9d53d # v4.53.3
        with:
          cmd: yq '.bookname' 'articles/config.yml'
      # Upload Distribution file
      - name: Upload distribution file to github artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.bookTitle.outputs.result }}
          path: ./articles/*.pdf
      # Upload Distribution file to the release (only when triggered by a release)
      - name: Upload distribution file to release assets
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG_NAME" ./articles/*.pdf --clobber
