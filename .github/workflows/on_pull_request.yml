name: Build Re:VIEW on Pull Request
on:
  pull_request:
    types: [opened, synchronize, reopened]
    # ビルドが読むものはすべて並べる。action は bundle install、npm install、
    # npm run pdf を順に走らせるので、原稿のほかに依存と grunt の定義も効く。
    paths:
      - "articles/**"
      - "Gruntfile.js"
      - "package.json"
      - "package-lock.json"
      - "Gemfile"
      - ".github/workflows/on_pull_request.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Build Book file
        uses: hitsumabushi845/ReVIEW-build-artifact-action@a076ebb331d828a3904f887933a52fcd2a27f39c # v1.1.0
      - name: Fetch book title
        id: bookTitle
        uses: mikefarah/yq@1b9b4ac5187171d2e5e3129be0cfa827c7f9d53d # v4.53.3
        with:
          cmd: yq '.bookname' 'articles/config.yml'
      - name: Upload color PDF
        id: upload-color
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ./articles/${{ steps.bookTitle.outputs.result }}.pdf
          archive: false
          retention-days: 7
      - name: Upload grayscale PDF
        id: upload-grayscale
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ./articles/${{ steps.bookTitle.outputs.result }}-GrayScale.pdf
          archive: false
          retention-days: 7
      - name: Comment artifact links on PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const bookName = '${{ steps.bookTitle.outputs.result }}';
            const colorUrl = '${{ steps.upload-color.outputs.artifact-url }}';
            const grayscaleUrl = '${{ steps.upload-grayscale.outputs.artifact-url }}';
            const marker = '<!-- pdf-build-comment -->';
            const builtAt = new Date().toLocaleString('ja-JP', { timeZone: 'Asia/Tokyo' });
            const body = `${marker}\n## :book: PDF Build Complete\n\n` +
              `| Version | Link |\n` +
              `|---------|------|\n` +
              `| Color | [${bookName}.pdf](${colorUrl}) |\n` +
              `| GrayScale | [${bookName}-GrayScale.pdf](${grayscaleUrl}) |\n\n` +
              `> :eyes: PDFファイルをブラウザで直接プレビューできます\n\n` +
              `Last built: ${builtAt} (JST)`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }
